<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MINT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect x='1' y='1' width='24' height='24' rx='7' fill='%2317191C'/%3E%3Cpath d='M7 17V9l6 5 6-5v8' fill='none' stroke='%23C9A227' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5F0;--surface:#FFFFFF;--tile:#FAF9F5;--ink:#17191C;--soft:#4A4F57;--muted:#6B7079;--line:#E7E2D8;--line2:#EFEBE3;--track:#F1EEE7;
--gold:#C9A227;--goldtext:#9A7714;--up:#13795B;--upbg:#EEF6F2;--down:#C2410C;--downbg:#FBEDE6;--downtext:#A8370A;--amber:#8A5A00;--amberbg:#FBF3E2;
--mkt:#3A4A6B;--mktbg:#EEF0F5;--grey:#E1DDD3;--hover:#FBFAF6;
--green:var(--up);--red:var(--down);--greenbg:var(--upbg);--redbg:var(--downbg)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select{font-family:inherit;font-size:14px}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--goldtext);outline-offset:2px;border-radius:6px}
.serif{font-family:Newsreader,Georgia,serif}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(247,245,240,.88);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:24px;padding-top:14px;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.08em}
.nav{display:flex;gap:4px;flex-grow:1;flex-wrap:wrap}
.nav button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--soft);transition:background .2s,color .2s}
.nav button:hover{background:#EFEBE3;color:var(--ink)}
.nav button.on{background:var(--ink);color:#fff}
.nav .sm{display:none}
.topright{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.cta{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:var(--gold);color:var(--ink);font-weight:600;font-size:14px;border:0;transition:transform .2s,box-shadow .2s}
.cta:hover{transform:translateY(-1px);box-shadow:0 8px 20px -10px rgba(154,119,20,.7)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--up);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(19,121,91,.45)}70%{box-shadow:0 0 0 9px rgba(19,121,91,0)}100%{box-shadow:0 0 0 0 rgba(19,121,91,0)}}

/* motion: plays when a page opens, not on every data refresh */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateX(100%)}to{transform:none}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.6s cubic-bezier(.4,0,.2,1) .2s both}
.grow{transform-origin:left center;animation:grow 1s cubic-bezier(.2,.7,.2,1) .45s both}
.fade{animation:fade .8s ease 1s both}
body.settled .rise,body.settled .draw,body.settled .grow,body.settled .fade{animation:none}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}.d4{animation-delay:.24s}.d5{animation-delay:.3s}.d6{animation-delay:.36s}
.lift{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.lift:hover{transform:translateY(-2px);box-shadow:0 12px 30px -14px rgba(23,25,28,.2);border-color:#D9D2C3}

/* building blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--goldtext)}
h1{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:52px;line-height:1.05;letter-spacing:-.01em;margin:8px 0 6px}
h2{font-size:20px;font-weight:600;margin:0}
h3{font-size:16px;font-weight:600;margin:0}
.lead{margin:0;max-width:640px;color:var(--soft);font-size:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.up{color:var(--up);font-weight:600}.down{color:var(--down);font-weight:600}
.good{color:var(--up);font-weight:600}.bad{color:var(--down);font-weight:600}
.tag{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--track);color:var(--soft)}
.t-up,.t-hit,.t-calm{background:var(--upbg);color:var(--up)}
.t-down,.t-miss,.t-alert{background:var(--downbg);color:var(--downtext)}
.t-watch,.t-partial,.t-tracking{background:var(--amberbg);color:var(--amber)}
.t-mkt{background:var(--mktbg);color:var(--mkt)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;background:var(--track);color:var(--soft)}
.p-alert,.p-alerted{background:var(--downbg);color:var(--downtext)}
.p-watch,.p-confirmed,.p-tracking{background:var(--amberbg);color:var(--amber)}
.p-calm,.p-context,.p-moved{background:var(--upbg);color:var(--up)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.link{font-size:14px;color:var(--soft);background:none;border:0;padding:0}
.link:hover{color:var(--goldtext)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:var(--ink);color:#fff;border:1px solid var(--ink);font-weight:500;transition:transform .15s,box-shadow .2s,opacity .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(23,25,28,.16)}
.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.btn.light{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.small{padding:7px 14px;font-size:13px}
.btn.danger{background:var(--surface);color:var(--down);border-color:#EBC6B6}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:7px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--soft);font-weight:500;font-size:13px;transition:border-color .2s,background .2s}
.chips button:hover{border-color:#C8C2B4}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:var(--bg);border:1px solid var(--line2)}
.seg button{border:0;background:transparent;color:var(--soft);padding:7px 14px;border-radius:999px;font-size:13px;transition:background .2s}
.seg button:hover{background:#EFEBE3}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* asset card + lenses */
.assets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:36px}
.asset{display:block;padding:28px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.asset-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.price{font-size:40px;font-weight:600;letter-spacing:-.02em}
.signal{display:flex;align-items:center;gap:14px;margin-top:18px;padding-top:18px;border-top:1px solid var(--line2)}
.sigbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;width:120px}
.sigbar div{height:8px;border-radius:4px;background:var(--grey)}
.sigbar .v-up{background:var(--up)}.sigbar .v-down{background:var(--down)}
.lenses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.lens{background:var(--tile);border-radius:14px;padding:14px;min-width:0}
.lens-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.lens-big{font-size:22px;font-weight:600;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lens-sub{font-size:12px;color:var(--soft)}
.vote{font-weight:700}.vote.up{color:var(--up)}.vote.down{color:var(--down)}.vote.none{color:var(--muted)}

/* rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.erow{display:flex;align-items:center;gap:16px;padding:16px 22px;border-bottom:1px solid var(--line2);cursor:pointer;transition:background .2s;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font:inherit;color:inherit}
.erow:last-child{border-bottom:0}
.erow:hover{background:var(--hover)}
.erow .dotc{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.erow .main{flex-grow:1;min-width:0}
.erow .ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .meta{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .fc{font-size:13px;font-weight:600;white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:12px}
.barlab{display:flex;justify-content:space-between;font-size:12px;color:var(--soft)}
.track{height:8px;border-radius:4px;background:var(--track);margin-top:5px;overflow:hidden}
.track>div{height:100%;border-radius:4px;background:var(--ink)}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:4px;background:#E9B8A3}
.split>div{background:var(--up)}

/* pager (like Google) */
.pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;margin-top:22px}
.pager button{min-width:40px;height:40px;padding:0 12px;border-radius:999px;border:0;background:transparent;color:var(--soft);font-size:14px;transition:background .2s}
.pager button:hover:not(:disabled){background:#EFEBE3}
.pager button.on{background:var(--ink);color:#fff;font-weight:600}
.pager button:disabled{opacity:.35;cursor:default}
.pager .gap{color:var(--muted);padding:0 4px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(23,25,28,.28);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:41;box-shadow:-24px 0 60px -30px rgba(23,25,28,.35);overflow-y:auto;transform:translateX(100%);visibility:hidden;transition:transform .45s cubic-bezier(.2,.7,.2,1),visibility 0s linear .45s}
.drawer.on{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.2,.7,.2,1),visibility 0s}
.drawer-in{padding:28px 32px 40px;display:flex;flex-direction:column;gap:24px}
.x{border:0;background:var(--bg);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.x:hover{background:#EFEBE3}
.box{background:var(--tile);border-radius:18px;padding:20px}
.lgrid{border:1px solid var(--line2);border-radius:16px;overflow:hidden}
.lgrid>div{display:grid;grid-template-columns:140px minmax(0,1fr) auto;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line2);font-size:14px;align-items:start}
.lgrid>div:last-child{border-bottom:0}
details.more{border-top:1px solid var(--line2);padding-top:14px}
details.more summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";color:var(--muted);font-weight:400}
details.more[open] summary::after{content:"−"}

/* big numbers */
.big{font-family:Newsreader,Georgia,serif;line-height:1}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.kpi-big{font-family:Newsreader,Georgia,serif;font-size:34px;line-height:1.1}
.kpi-label{font-size:13px;font-weight:600;margin-top:6px}
.kpi-sub{font-size:12px;color:var(--muted);margin-top:2px}

/* pipeline */
.pipe{display:flex;align-items:stretch;margin-top:36px}
.pipe .step{flex:1 1 0;min-width:0;padding:20px}
.pipe .wire{width:36px;align-self:center;height:2px;background-image:linear-gradient(90deg,var(--gold) 50%,transparent 50%);background-size:12px 2px;animation:flow 1.2s linear infinite}
@keyframes flow{from{background-position:0 0}to{background-position:24px 0}}
.sdot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* kept detail tables + settings */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:12px 14px;text-transform:uppercase}
td{padding:12px 14px;border-top:1px solid var(--line2);vertical-align:top}
.htable{width:100%;border-collapse:collapse;font-size:14px}
.htable th{border-bottom:1px solid var(--line2);padding:12px 16px;white-space:nowrap}
.htable td{padding:13px 16px;border-top:0;border-bottom:1px solid var(--line2);vertical-align:middle}
.htable tr:last-child td{border-bottom:0}
.htable .num,.num{text-align:right;white-space:nowrap}
.htable.bt{min-width:1040px}.htable.bt .evcol{min-width:260px}.htable.bt td{white-space:nowrap}.htable.bt td.evcol{white-space:normal}
.ev-title{font-weight:600;font-size:14px;line-height:1.35}
.ev-meta{font-size:12px;color:var(--muted);margin-top:3px}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;padding:12px 20px;font-size:12px;color:var(--muted);border-top:1px solid var(--line2);background:var(--hover)}
.bar{flex:1;height:6px;border-radius:99px;background:var(--track);overflow:hidden}.bar div{height:100%;background:var(--ink)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:14px}
.kv:last-child{border-bottom:0}
.weektext{white-space:pre-wrap;font-size:13px;line-height:1.6;margin-top:10px;color:var(--soft)}
pre{white-space:pre-wrap;font-size:12px;line-height:1.5;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;max-height:420px;overflow:auto;margin:10px 0 0}
.banner{margin-top:16px;padding:12px 18px;border-radius:14px;background:var(--amberbg);color:#6B4A0F;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;font-size:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
.switch{position:relative;width:46px;height:26px;border-radius:99px;background:var(--grey);border:0;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--up)}.switch.on::after{left:23px}
.setting{display:flex;gap:18px;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.setting:last-child{border-bottom:0}
.setting .txt{flex:1 1 320px}
.setting .txt div{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.5}
input[type=password],input[type=text],input[type=number],input[type=date],select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.page-settings h2{margin:30px 0 12px}

footer.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);padding:28px 0 40px}
.join{margin-top:40px;background:var(--ink);color:#F7F5F0;border-radius:24px;padding:32px 36px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px}

@media (max-width:900px){
  .assets{grid-template-columns:minmax(0,1fr)}
  .three{grid-template-columns:minmax(0,1fr)}
  .pipe{flex-direction:column}.pipe .wire{width:2px;height:24px;align-self:center;background-image:linear-gradient(180deg,var(--gold) 50%,transparent 50%);background-size:2px 12px}
}
@media (max-width:720px){
  .wrap{padding:0 16px}
  h1{font-size:34px}
  .price{font-size:32px}
  .asset{padding:20px}
  .nav{position:fixed;left:16px;right:16px;bottom:16px;justify-content:space-around;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 10px 30px -14px rgba(23,25,28,.3);z-index:30;flex-wrap:nowrap}
  .nav button{padding:10px 12px;font-size:13px;white-space:nowrap}
  .nav .lg{display:none}.nav .sm{display:inline}
  .topright .upd{display:none}
  body{padding-bottom:84px}
  .lenses{grid-template-columns:minmax(0,1fr)}
  .lens{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px}
  .lens .lens-top{order:3}.lens .lens-big{font-size:16px;margin:0}
  .erow{padding:14px 16px;flex-wrap:wrap;gap:6px 12px}
  .erow .main{flex-basis:calc(100% - 26px)}
  .erow .fc{margin-left:26px}
  .lgrid>div{grid-template-columns:minmax(0,1fr) auto}.lgrid>div>span:nth-child(2){grid-column:1 / -1;grid-row:2}
  .drawer-in{padding:22px 18px 40px}
  .join{padding:24px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <a class="brand" href="#" onclick="go('today');return false">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="7" fill="#17191C"/><path d="M7 17V9l6 5 6-5v8" fill="none" stroke="#C9A227" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>MINT</a>
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <div class="topright" id="topright"></div>
</div></div>
<div class="wrap"><div id="banner"></div></div>
<main id="main" class="wrap"><div class="empty">Loading MINT...</div></main>
<div class="wrap"><footer class="foot"><span>MINT · IB MYP Personal Project 2026/27 · risk information, not financial advice.</span><span id="credit"></span></footer></div>
<div class="scrim" id="scrim" onclick="closeEvent()"></div>
<aside class="drawer" id="drawer" aria-label="Event detail" aria-hidden="true"></aside>
<div class="toast" id="toast"></div>

<script>
// ---------------------------------------------------------------------------
// MINT website (v29). On GitHub Pages it is VIEW-ONLY and reads state.json; on the PC it talks to the MINT program.
// ---------------------------------------------------------------------------
const STATIC = !["localhost", "127.0.0.1"].includes(location.hostname);
const UI_VERSION = "29";   // must match VERSION in app.py
const PER_PAGE = 10;
const UI = {tab:"today", asset:"Bitcoin", range:"7D", hover:null, open:null, page:1, efAsset:"all", efKind:"all", out:{}, lastJson:"", testOutput:""};
let S = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = v => v == null ? "–" : "$" + Math.round(v).toLocaleString("en-US");
const pctTxt = v => v == null ? "–" : Math.abs(v) < 0.05 ? "0.0%" : (v > 0 ? "+" : "") + v.toFixed(1) + "%";
const pctCls = v => v == null ? "muted" : v >= 0.05 ? "up" : v <= -0.05 ? "down" : "";
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const p2 = n => String(n).padStart(2,"0");
function when(iso, withTime=true){ if(!iso) return "–"; const d = new Date(iso);
  return d.getDate()+" "+MON[d.getMonth()] + (withTime ? " "+p2(d.getHours())+":"+p2(d.getMinutes()) : ""); }
function ago(iso){ if(!iso) return "never"; const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "just now"; if (m < 60) return m + " min ago"; if (m < 1440) return Math.round(m/60) + " h ago";
  const d = Math.round(m/1440); return d === 1 ? "yesterday" : d + " days ago"; }
function until(iso){ const m = Math.round((new Date(iso) - Date.now()) / 60000);

  const last = p[p.length-1], from = p.find(x => x[0] >= last[0] - ms) || p[0]; return (last[1]-from[1])/from[1]*100; }
const coin = (a, size=36) => a === "Gold"
  ? `<svg width="${size}" height="${size}" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="17" fill="#C9A227"/><text x="18" y="23.5" text-anchor="middle" font-family="Newsreader,serif" font-size="15" font-weight="600" fill="#3A2C08">Au</text></svg>`

const statusTag = st => { const s = (st || "Calm").toLowerCase(); return `<span class="tag ${s==="calm"?"t-calm":s==="watch"?"t-watch":s==="alert"?"t-alert":""}">${esc(st || "Calm")}</span>`; };
const voteSym = v => v > 0 ? `<span class="vote up" aria-label="points up">↑</span>` : v < 0 ? `<span class="vote down" aria-label="points down">↓</span>` : `<span class="vote none" aria-label="no clear signal">–</span>`;
const voteCls = v => v > 0 ? "v-up" : v < 0 ? "v-down" : "";

// the three lenses for one asset, in plain words
function lenses(a){
  const M = S.market || {}, L = (M.lenses || {})[a] || {}, N = (M.news || {})[a] || {};
  const vol = L.volume || {}, bs = L.buy_sell || {};
  const n = N.events || 0;
  const news = {name:"News", vote:N.vote||0, ok:N.ok !== false && M.news != null,
    big: n === 1 ? "1 story" : n + " stories", sub: N.vote > 0 ? "leaning up" : N.vote < 0 ? "leaning down" : n ? "no clear direction" : "nothing new (24 h)"};
  const word = String(vol.text||"").split(":")[0];
  const volume = {name:"Volume", vote:vol.vote||0, ok:!!vol.ok,
    big: vol.ratio != null ? vol.ratio.toFixed(1) + "×" : "–",
    sub: !vol.ok ? "no data" : (word ? word : "normal") + (vol.change_24h != null ? `, price ${pctTxt(vol.change_24h)}` : "")};
  const share = bs.taker_buy_share ?? bs.up_volume_share ?? bs.book_bid_share;
  const b = share != null ? Math.round(share*100) : null;
  const buyers = {name:"Buyers vs sellers", vote:bs.vote||0, ok:!!bs.ok,
    big: b != null ? `${b} / ${100-b}` : "–",
    sub: !bs.ok ? "no data" : bs.vote > 0 ? "buyers in control" : bs.vote < 0 ? "sellers in control" : "evenly matched"};
  const all = [news, volume, buyers];
  const ups = all.filter(x => x.vote > 0).length, downs = all.filter(x => x.vote < 0).length;
  const verdict = ups && downs ? "Lenses disagree" : ups >= 2 ? `${ups} of 3 point up` : downs >= 2 ? `${downs} of 3 point down` : "No clear signal";
  return {news, volume, buyers, all, ups, downs, verdict, raw:{vol, bs, N}, time:M.time, errors:M.errors||[], has: Object.keys(M.lenses||{}).length > 0};
}
const sigbar = Ls => `<div class="sigbar" aria-hidden="true">${Ls.all.map((x,i) => `<div class="grow ${voteCls(x.vote)}" style="animation-delay:${.5+i*.15}s"></div>`).join("")}</div>`;

// a small price line with event markers
function spark(a, w=520, h=90, days=7){
  const all = (S.assets[a]||{}).points || []; if (all.length < 2) return `<div class="muted small" style="height:${h}px;display:flex;align-items:center">No price history yet.</div>`;
  const end = all[all.length-1][0]; let pts = all.filter(p => p[0] >= end - days*864e5);
  if (pts.length > 160) { const s = Math.ceil(pts.length/160); pts = pts.filter((p,i) => i % s === 0 || i === pts.length-1); }
  const vals = pts.map(p => p[1]); let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi-lo)*.12 || 1; lo -= pad; hi += pad;
  const t0 = pts[0][0], t1 = pts[pts.length-1][0];
  const X = t => (t-t0)/(t1-t0||1)*w, Y = v => (hi-v)/(hi-lo)*h;
  const d = pts.map((p,i) => (i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
  const color = a === "Gold" ? "#B08A1E" : "#17191C", mk = a === "Gold" ? "#17191C" : "#C9A227";
  const marks = S.events.filter(e => e.asset===a && !HIDDEN.includes(e.state)).map(e => ({t:new Date(e.first_seen).getTime(), e})).filter(m => m.t >= t0 && m.t <= t1).slice(0,8)
    .map(m => { const near = pts.reduce((b,p) => Math.abs(p[0]-m.t) < Math.abs(b[0]-m.t) ? p : b);
      return `<circle cx="${X(m.t).toFixed(1)}" cy="${Y(near[1]).toFixed(1)}" r="4.5" fill="#fff" stroke="${mk}" stroke-width="2"><title>${esc(m.e.title)}</title></circle>`; }).join("");
  return `<svg viewBox="-6 -6 ${w+12} ${h+12}" style="width:100%;height:${h}px;display:block;margin-top:10px" aria-hidden="true">
    <path d="${d}" pathLength="1" class="draw" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>${marks}</svg>`;
}

// forecast in one short line: "↓ 0.8–1.5% · 1.5 d · 70%"
function fcShort(e){
  const p = e.prediction || {}, f = p.forecast; if (!f || !["up","down"].includes(p.direction)) return "";
  const lo = Math.min(Math.abs(f.low), Math.abs(f.high)), hi = Math.max(Math.abs(f.low), Math.abs(f.high));
  return `${p.direction==="up"?"↑":"↓"} ${lo.toFixed(1)}–${hi.toFixed(1)}% · ${hrs(f.window_hours)} · ${Math.round(f.probability*100)}%`;
}
function rowRight(e){
  const o = e.outcome || {}, r = o.result || {}, p = e.prediction || {};

  else fc = fcShort(e) ? `<span class="fc ${p.direction==="up"?"up":"down"}">${fcShort(e)}</span>` : `<span class="fc muted">no prediction</span>`;
  const tag = judged ? resultTag(o.effect) : e.market_triggered ? `<span class="tag t-mkt">Market</span>` : `<span class="tag ${STATE_TAG[e.state]||""}">${esc(STATE_WORDS[e.state]||e.state)}</span>`;
  return fc + tag;
}

// the big price chart (hover to read a price)
function bigChart(a){
  const all = (S.assets[a]||{}).points || [];
  const span = {"1D":864e5, "7D":7*864e5, "1M":30*864e5}[UI.range];
  const end = all.length ? all[all.length-1][0] : 0;
  let pts = all.filter(p => p[0] >= end - span);
  if (pts.length < 2) return `<div class="empty">No price history yet. It appears after the first run.</div>`;
  if (pts.length > 400) { const s = Math.ceil(pts.length/400); pts = pts.filter((p,i) => i % s === 0 || i === pts.length-1); }
  UI.pts = pts;
  const W=1160,H=300,L=0,R=1160,T=36,B=270;
  const vals = pts.map(p=>p[1]); let lo=Math.min(...vals), hi=Math.max(...vals); const pad=(hi-lo)*.1||1; lo-=pad; hi+=pad;
  const t0=pts[0][0], t1=pts[pts.length-1][0];
  const X = t => L + (t-t0)/(t1-t0||1)*(R-L), Y = v => T + (hi-v)/(hi-lo)*(B-T);
  UI.geo = {X,Y,W,T,B};
  const line = pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
  const color = a==="Gold" ? "#B08A1E" : "#17191C";
  let labels = "";
  for (let k=0;k<3;k++){ const t=t0+(t1-t0)*k/2, d=new Date(t);
    const lab = UI.range==="1D" ? p2(d.getHours())+":"+p2(d.getMinutes()) : d.getDate()+" "+MON[d.getMonth()];
    labels += `<text x="${X(t).toFixed(1)}" y="296" text-anchor="${k===0?"start":k===2?"end":"middle"}" font-size="12" fill="#6B7079">${lab}</text>`; }
  const marks = S.events.filter(e => e.asset===a && !HIDDEN.includes(e.state)).map(e => ({t:new Date(e.first_seen).getTime(), e})).filter(m => m.t>=t0 && m.t<=t1).slice(0,6)
    .map((m,i) => { const near = pts.reduce((b,p)=>Math.abs(p[0]-m.t)<Math.abs(b[0]-m.t)?p:b);
      const c = m.e.market_triggered ? "#3A4A6B" : "#C9A227", x = X(m.t), y = Y(near[1]);
      return `<g class="fade" style="cursor:pointer" onclick="openEvent('${esc(m.e.id)}')"><title>${esc(m.e.title)}</title>
        <line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${T-8}" y2="${B}" stroke="${c}" stroke-dasharray="3 4" opacity=".8"/>
        <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" fill="#fff" stroke="${c}" stroke-width="2.5"/></g>`; }).join("");
  return `<div style="position:relative;margin-top:24px"><svg id="chart" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="${a} price chart"
      onmousemove="chartHover(event)" onmouseleave="UI.hover=null;chartHoverDraw()">
    <path d="M0 ${T} H${W} M0 ${(T+B)/2} H${W} M0 ${B} H${W}" stroke="#F1EEE7" fill="none"/>
    <path d="${line} L${X(t1).toFixed(1)} ${B} L${L} ${B} Z" fill="${color}" opacity=".05" class="fade"/>
    <path d="${line}" pathLength="1" class="draw" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round"/>
    ${marks}${labels}<g id="hoverg"></g></svg></div>
    <p class="small muted" style="margin:6px 0 0">Move over the chart to read a price. Circles are events (gold = from news, blue = market signal); click one to open it.</p>`;
}
function chartHover(ev){
  const svg = document.getElementById("chart"); if (!svg || !UI.pts) return; const r = svg.getBoundingClientRect();
  const x = (ev.clientX - r.left) / r.width * UI.geo.W; let best = 0, bd = 1e9;
  UI.pts.forEach((p,i) => { const d = Math.abs(UI.geo.X(p[0]) - x); if (d < bd) { bd = d; best = i; } });
  UI.hover = best; chartHoverDraw();
}
function chartHoverDraw(){
  const g = document.getElementById("hoverg"), price = document.getElementById("chartprice"), chg = document.getElementById("chartchg");
  if (!g || !UI.pts) return;
  if (UI.hover == null) { g.innerHTML = ""; return; }
  const p = UI.pts[UI.hover], first = UI.pts[0], c = (p[1]-first[1])/first[1]*100;
  if (price) price.textContent = money(p[1]);
  if (chg) chg.innerHTML = `<span class="${pctCls(c)}" style="font-size:16px">${pctTxt(c)}</span> <span class="small muted">${when(new Date(p[0]).toISOString())}</span>`;
  const x = UI.geo.X(p[0]).toFixed(1), y = UI.geo.Y(p[1]).toFixed(1);
  g.innerHTML = `<line x1="${x}" x2="${x}" y1="${UI.geo.T}" y2="${UI.geo.B}" stroke="#17191C" stroke-dasharray="3 3" opacity=".35"/><circle cx="${x}" cy="${y}" r="5" fill="${UI.asset==="Gold"?"#B08A1E":"#17191C"}" stroke="#fff" stroke-width="2"/>`;
}

function eventsPage(){

     fk==="judged" ? ["right","wrong","partial","no_clear_move"].includes((e.outcome||{}).effect) : (e.outcome||{}).effect==="tracking")));
  const pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
  UI.page = Math.min(Math.max(1, UI.page), pages);
  const start = (UI.page-1)*PER_PAGE, shown = list.slice(start, start+PER_PAGE);
  const chip = (key, val, label) => `<button class="${UI[key]===val?"on":""}" onclick="UI.${key}='${val}';UI.page=1;settleSoon();render()">${label}</button>`;
  return `<section class="rise" style="padding-top:44px"><div class="eyebrow">Events</div><h1>Everything MINT has found</h1>
    <p class="lead">One row per event, newest first. Open one to see the forecast, what each lens said, and how it turned out.</p></section>
  <div class="rise d1" style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:center;margin:26px 0 14px">
    <div style="display:flex;flex-wrap:wrap;gap:10px">
      <div class="chips">${chip("efAsset","all","All")}${chip("efAsset","Bitcoin","Bitcoin")}${chip("efAsset","Gold","Gold")}</div>
      <div class="chips">${chip("efKind","all","Any")}${chip("efKind","news","From news")}${chip("efKind","market","Market signals")}${chip("efKind","tracking","Open")}${chip("efKind","judged","Judged")}</div>
    </div>
    <div class="small muted">${list.length ? `${start+1}–${start+shown.length} of ${list.length}` : "0 events"}</div></div>
  <div class="list rise d2">${shown.length ? shown.map(eventRow).join("") : `<div class="empty">No events match.</div>`}</div>
  ${pages > 1 ? pager(pages) : ""}`;
}
function pager(pages){
  const cur = UI.page, nums = [];
  const add = n => nums.push(n);
  if (pages <= 9) { for (let i=1;i<=pages;i++) add(i); }
  else { add(1); let s = Math.max(2, cur-3), e = Math.min(pages-1, cur+3);
    if (cur <= 5) { s = 2; e = 8; } if (cur >= pages-4) { s = pages-7; e = pages-1; }
    if (s > 2) add("…"); for (let i=s;i<=e;i++) add(i); if (e < pages-1) add("…"); add(pages); }
  const btn = (n) => n === "…" ? `<span class="gap">…</span>` : `<button class="${n===cur?"on":""}" ${n===cur?'aria-current="page"':""} onclick="goPage(${n})">${n}</button>`;
  return `<nav class="pager" aria-label="Pages"><button ${cur===1?"disabled":""} onclick="goPage(${cur-1})">‹ Previous</button>${nums.map(btn).join("")}<button ${cur===pages?"disabled":""} onclick="goPage(${cur+1})">Next ›</button></nav>`;
}
function goPage(n){ UI.page = n; settleSoon(); render(); window.scrollTo({top:0, behavior:"smooth"}); }

// how the prediction is going: price path since MINT predicted, with the HIT line
function progressBlock(e){
  const p = e.prediction || {}, f = p.forecast, o = e.outcome || {}, r = o.result || {};
  if (!f || !["up","down"].includes(p.direction) || !r.start_price) return o.effect_reason ? `<section><h3>How it is going</h3><p class="small muted" style="margin:6px 0 0">${esc(o.effect_reason)}</p></section>` : "";
  const t0 = new Date(r.start_time || e.first_seen).getTime(), win = (r.window_hours || f.window_hours) * 3600e3;
  const pts = ((S.assets[e.asset]||{}).points || []).filter(x => x[0] >= t0 - 1800e3 && x[0] <= t0 + win);
  const sgn = p.direction === "up" ? 1 : -1, thr = (r.threshold || f.threshold || 0.5);
  const moves = pts.map(x => [x[0], (x[1]-r.start_price)/r.start_price*100]);
  const elapsed = Math.min(win, Math.max(0, (moves.length ? moves[moves.length-1][0] : t0) - t0));
  const judged = ["right","wrong","partial","no_clear_move"].includes(o.effect);
  let chart = "";
  if (moves.length > 1) {
    const W = 480, H = 150, ys = moves.map(m => m[1]).concat([0, sgn*thr, sgn*Math.abs(f.mid||thr*2)]);
    let lo = Math.min(...ys), hi = Math.max(...ys); const pad = (hi-lo)*.15 || .5; lo -= pad; hi += pad;
    const X = t => (t - t0) / win * W, Y = v => (hi - v) / (hi - lo) * H;
    const d = moves.map((m,i) => (i?"L":"M") + Math.max(0,X(m[0])).toFixed(1) + " " + Y(m[1]).toFixed(1)).join(" ");
    const zoneTop = sgn > 0 ? 0 : Y(sgn*thr), zoneH = sgn > 0 ? Y(sgn*thr) : H - Y(sgn*thr);
    const last = moves[moves.length-1];
    chart = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;margin-top:10px;overflow:visible" role="img" aria-label="Price move since the prediction: ${pctTxt(last[1])}">
      <rect x="0" y="${zoneTop.toFixed(1)}" width="${W}" height="${Math.max(0,zoneH).toFixed(1)}" fill="${sgn>0?"#13795B":"#C2410C"}" opacity=".07"/>
      <line x1="0" x2="${W}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="#C8C2B4" stroke-dasharray="3 4"/>
      <line x1="0" x2="${W}" y1="${Y(sgn*thr).toFixed(1)}" y2="${Y(sgn*thr).toFixed(1)}" stroke="${sgn>0?"#13795B":"#C2410C"}" stroke-dasharray="4 4"/>
      <text x="${W-4}" y="${(Y(0)-6).toFixed(1)}" text-anchor="end" font-size="11" fill="#6B7079">start</text>
      <text x="${W-4}" y="${(Y(sgn*thr)+(sgn>0?-6:14)).toFixed(1)}" text-anchor="end" font-size="11" fill="${sgn>0?"#13795B":"#A8370A"}">HIT line ${sgn>0?"+":"−"}${thr.toFixed(1)}%</text>
      <path d="${d}" pathLength="1" class="draw" fill="none" stroke="${e.asset==="Gold"?"#B08A1E":"#17191C"}" stroke-width="2.4" stroke-linejoin="round"/>
      <circle cx="${Math.max(0,X(last[0])).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="4.5" fill="${e.asset==="Gold"?"#B08A1E":"#17191C"}"/>
      ${!judged ? `<line x1="${X(last[0]).toFixed(1)}" x2="${X(last[0]).toFixed(1)}" y1="0" y2="${H}" stroke="#E7E2D8"/>` : ""}</svg>`;
  }
  return `<section><div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><h3>${judged ? "How it turned out" : "How it is going"}</h3>
      <span class="small muted">${hrs(elapsed/3600e3)} of ${hrs(win/3600e3)}</span></div>
    ${chart}
    <p class="small" style="margin:8px 0 0;color:var(--soft)">${esc(r.text || o.effect_reason || "")}${!judged ? ` A HIT needs ${e.asset} to pass the line the predicted way and stay there for 2 hours before the window ends.` : ""}</p></section>`;
}

const AGENT_JOBS = {"Bitcoin Scout":"Searches Google News and reads the SEC feeds. Checks the Nasdaq and Bitcoin's Wikipedia views.",
  "Gold Scout":"Reads the Fed and US jobs/inflation calendars and searches gold news.",
  "Social Watcher":"Reads posts from a few approved accounts. Posts are labelled as social media.",
  "Supervisor":"Groups stories into events, checks the proof, remembers what it has seen.",
  "Price Tracker":"Saves prices, reads trading volume and buyers vs sellers, and judges each prediction.",
  "Decision agent":"Checks the event date, makes the forecast and writes the alert.",
  "Telegram bot":"Sends each finding once, straight away, and one summary at 9 pm India time."};
function how(){
  const ag = Object.fromEntries((S.agents||[]).map(a => [a.name, a]));

    ["2 · CHECK","Supervisor","Keeps approved sources only, drops old news and joins repeats into one event.",["Supervisor"]],
    ["3 · MEASURE","Price Tracker","Prices, trading volume and buyers vs sellers, from Kraken, Yahoo Finance and the CFTC.",["Price Tracker"]],
    ["4 · DECIDE","Decision agent","Makes the forecast from similar past events, adjusted by the volume and buyers-vs-sellers lenses.",["Decision agent"]],
    ["5 · TELL","Telegram bot","Sends short alerts straight away and one summary at 9 pm India time.",["Telegram bot"]]];

    <div class="panel rise d3" style="padding:24px"><div class="small muted">Typical delay</div><div style="font-size:30px;font-weight:600;margin-top:6px">${D.median_hours==null?"–":D.median_hours.toFixed(1)+" h"}</div><div class="small" style="color:var(--soft)">first report to MINT noticing${Object.keys(D.by_asset||{}).map(a => ` · ${a} ${D.by_asset[a]} h`).join("")}</div></div>

          <td class="num" style="font-weight:600">${x.d1>0?"↑ ":x.d1<0?"↓ ":""}${pctTxt(x.d1)}</td><td class="num muted">${pctTxt(x.d7)}</td>

function byTime(all){
  const stats = CHECKS.map(c => { let r = 0, w = 0, f = 0;
    all.forEach(e => { const x = (e.outcome||{})[c[0]]; if (!x || !["up","down"].includes((e.prediction||{}).direction)) return;
      if (x.verdict === "right") r++; else if (x.verdict === "wrong") w++; else f++; });
    return {label: c[1], r, w, f}; });
  return `<h2 style="margin:34px 0 12px">Accuracy by time after the event</h2>
  <div class="card" style="overflow-x:auto"><table class="htable"><thead><tr><th>Time after first report</th><th class="num">Right</th><th class="num">Wrong</th><th class="num">Too small</th><th style="width:240px">Accuracy (clear moves)</th></tr></thead><tbody>
  ${stats.map(x => { const n = x.r + x.w, acc = n ? x.r/n : null; return `<tr><td>${x.label}</td><td class="num good">${x.r}</td><td class="num bad">${x.w}</td><td class="num muted">${x.f}</td>
    <td>${!n ? `<span class="muted" style="font-size:13px">no clear moves yet</span>` : `<div style="display:flex;align-items:center;gap:10px"><div class="bar"><div style="width:${Math.round(acc*100)}%"></div></div><span class="num" style="width:40px">${Math.round(acc*100)}%</span></div>`}</td></tr>`; }).join("")}
  </tbody></table><div class="legend"><span>Shows WHEN MINT's predictions work best - e.g. right in the first hours but not after a week, when other news has mixed in.</span></div></div>`;
}
function backtestCard(){
  const B = S.backtest;
  const tick = ok => ok ? `<span class="good">✓</span>` : `<span class="bad">✗</span>`;
  const dir = d => d==="up" ? "↑ up" : d==="down" ? "↓ down" : (d || "–");
  return `<h2 style="margin:34px 0 6px">Past-event test (success criterion 1)</h2>
  <div class="muted" style="font-size:14px;max-width:820px;line-height:1.6;margin-bottom:12px">MINT gets only the date, asset and headline of 5 real past events, and predicts up or down
    using past events from <b>before</b> that date. The real moves come from my answer key, which MINT never sees.
    <b>Rules</b> = similar past events + the factor's pattern; <b>AI</b> = Groq, told to pretend it is that date (it may still remember famous events, so the rules column is the fairest test);
    <b>MINT final</b> = the AI's answer when the AI is on, as in live use. A pass needs all 3 checks: an alert is sent, the right asset and factor, and the right direction over 7 days.</div>
  <div class="card" style="overflow-x:auto">${!B || !B.total ? `<div class="empty">No past events yet. Add your 5 events and your answer key to <code>backtest_events.json</code> (on GitHub or in the MINT folder); MINT tests them on the next run.</div>` :
  `<table class="htable bt"><thead><tr><th>Date</th><th class="evcol">Event</th><th>Factor</th><th>Alert?</th><th>Rules</th><th>AI</th><th>MINT final</th><th class="num">Real 1 day</th><th class="num">Real 7 days</th><th title="alert sent · right asset and factor · right direction">Checks</th><th>Result</th></tr></thead><tbody>
  ${B.results.map(r => `<tr><td class="muted" style="white-space:nowrap">${esc(r.date)}</td><td class="evcol"><div class="ev-title">${esc(r.headline)}</div><div class="ev-meta">${esc(r.asset)}${r.expected_factor ? " · expected "+esc(r.expected_factor) : ""} · ${r.similar_used} similar past event(s) used</div></td>
    <td>${esc(r.factor || "none")}</td><td>${r.alert ? "Alert" : "Info only"}</td><td title="${esc(r.rules_reason)}" class="${r.rules_right ? "good" : r.real_direction ? "bad" : ""}">${dir(r.rules)}</td>
    <td title="${esc(r.ai_why || r.ai_by)}" class="${r.ai_right === true ? "good" : r.ai_right === false ? "bad" : "muted"}">${r.ai ? dir(r.ai) : `<span class="muted" style="font-size:12px">${esc(r.ai_by)}</span>`}</td>
    <td style="font-weight:600">${dir(r.prediction)}</td>
    <td class="num">${pctTxt(r.real.d1)}</td><td class="num">${pctTxt(r.real.d7)}</td>
    <td>${tick(r.checks.alert_sent)} ${tick(r.checks.right_asset_and_factor)} ${tick(r.checks.right_direction_7_days)}</td>
    <td>${r.passed ? `<span class="pill p-moved">Pass</span>` : `<span class="pill p-alert">Fail</span>`}</td></tr>`).join("")}
  </tbody></table><div class="legend"><span>Checks: ✓/✗ alert sent · right asset and factor · right direction (7 days)</span><span><b>${B.passed} of ${B.total}</b> passed all 3 checks · directions right: rules ${B.rules_right} of ${B.total}${B.ai_used ? `, AI ${B.ai_right} of ${B.ai_used}` : ""} · tested ${when(B.time)}</span></div>`}</div>`;
}
function reliabilityCard(){
  const R = S.reliability;
  const sent = S.events.filter(e => (e.telegram||{}).first_sent_at).map(e => ({e, noticedMin: (new Date(e.telegram.first_sent_at) - new Date(e.first_seen))/60000,
    reportHours: (new Date(e.telegram.first_sent_at) - new Date(e.earliest_report))/3600000}));
  const within = sent.filter(x => x.noticedMin <= 15).length;
  const dur = m => m < 1 ? "under 1 min" : m < 90 ? Math.round(m)+" min" : (m/60).toFixed(1)+" h";
  return `<h2 style="margin:34px 0 6px">Reliability and speed (success criterion 5)</h2>
  <div class="muted" style="font-size:14px;max-width:820px;line-height:1.6;margin-bottom:12px">Every run is logged. Target: at least 95% of runs finish without an error,
    and every alert reaches Telegram within 15 minutes of the run that found it.</div>
  <section class="kpis" style="margin-top:0">
    ${R ? `<div class="kpi"><div class="kpi-big">${Math.round(R.ok/R.runs*100)}%</div><div class="kpi-label">Runs without errors</div><div class="kpi-sub">${R.ok} of ${R.runs} runs in the last 7 days</div></div>
    <div class="kpi"><div class="kpi-big">${R.median_gap_min ?? "–"} min</div><div class="kpi-label">Typical time between runs</div><div class="kpi-sub">longest gap ${R.max_gap_min ?? "–"} min · a run takes ${R.avg_seconds}s</div></div>` :
    `<div class="kpi"><div class="kpi-big">–</div><div class="kpi-label">Runs without errors</div><div class="kpi-sub">The run log starts with the next run</div></div>`}
    <div class="kpi"><div class="kpi-big">${sent.length ? within+" of "+sent.length : "–"}</div><div class="kpi-label">Messages within 15 min</div><div class="kpi-sub">from MINT finding the event to the Telegram message</div></div>
  </section>
  ${sent.length ? `<div class="card" style="overflow-x:auto;margin-top:14px"><table class="htable"><thead><tr><th>Event</th><th>First reported</th><th>MINT found it</th><th>Telegram sent</th><th class="num">Found → sent</th><th class="num">First report → sent</th></tr></thead><tbody>
    ${sent.map(x => `<tr><td><div class="ev-title">${esc(x.e.title)}</div><div class="ev-meta">${esc(x.e.asset)} · ${esc(STATE_WORDS[x.e.state]||x.e.state)}</div></td><td class="muted">${when(x.e.earliest_report)}</td><td class="muted">${when(x.e.first_seen)}</td><td class="muted">${when(x.e.telegram.first_sent_at)}</td>
      <td class="num ${x.noticedMin <= 15 ? "good" : "bad"}">${dur(x.noticedMin)}</td><td class="num muted">${dur(x.reportHours*60)}</td></tr>`).join("")}
  </tbody></table><div class="legend"><span>"First report → sent" includes the time before MINT could see the story (the news website publishing it, Google listing it).</span></div></div>` : ""}`;
}
